      front left leg:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      front right leg:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      rear left leg:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      rear right leg:
        hit_chance_modifier: -10
