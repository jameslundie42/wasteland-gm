# Creature Templates for Wasteland GM
# Each template defines an archetype that can be spawned into combat
# personality_traits are combined with the agent's traits for NPC behavior
# default_agent sets initial disposition (can be changed mid-game)

templates:
  # === RAIDERS ===
  Raider:
    category: humanoid
    description: "Common wasteland bandits. Poorly equipped but dangerous in numbers."
    default_agent: npc_hostile
    personality_traits:
      - aggressive
      - greedy
      - respects strength
    special:
      base:
        strength: 5
        perception: 5
        endurance: 5
        charisma: 3
        intelligence: 4
        agility: 5
        luck: 5
      variance: 2
    level:
      base: 1
      variance: 2
    skills:
      - Guns
      - Melee
    affiliation: Raiders
    loot_table:
      guaranteed:
        - item: "Bottle Caps"
          quantity: "5-25"
      chance:
        - item: "10mm Pistol"
          chance: 0.3
        - item: "Pipe Rifle"
          chance: 0.2
        - item: "Stimpak"
          chance: 0.15
        - item: "10mm Ammo"
          quantity: "5-15"
          chance: 0.4
    name_patterns:
      - "Raider #{n}"

  Raider Psycho:
    category: humanoid
    description: "Drug-fueled raider berserker. Hits hard, ignores pain."
    default_agent: npc_hostile
    personality_traits:
      - unhinged
      - pain-resistant
      - loves violence
    special:
      base:
        strength: 7
        perception: 4
        endurance: 7
        charisma: 2
        intelligence: 3
        agility: 6
        luck: 4
      variance: 1
    level:
      base: 3
      variance: 2
    skills:
      - Melee
      - Unarmed
    affiliation: Raiders
    loot_table:
      guaranteed:
        - item: "Bottle Caps"
          quantity: "10-40"
        - item: "Psycho"
          quantity: "1-2"
      chance:
        - item: "Super Sledge"
          chance: 0.2
        - item: "Combat Knife"
          chance: 0.4
        - item: "Buffout"
          chance: 0.3
    name_patterns:
      - "Raider Psycho #{n}"

  Raider Boss:
    category: humanoid
    description: "Raider leader. Better equipped and more cunning."
    default_agent: npc_hostile
    personality_traits:
      - cunning
      - commands respect
      - ruthless but pragmatic
    special:
      base:
        strength: 6
        perception: 6
        endurance: 6
        charisma: 5
        intelligence: 5
        agility: 6
        luck: 6
      variance: 1
    level:
      base: 5
      variance: 3
    skills:
      - Guns
      - Melee
      - Speech
    affiliation: Raiders
    loot_table:
      guaranteed:
        - item: "Bottle Caps"
          quantity: "50-150"
        - item: "Combat Rifle"
          quantity: "1"
      chance:
        - item: "Combat Armor"
          chance: 0.5
        - item: "Stimpak"
          quantity: "2-4"
          chance: 0.7
        - item: "Med-X"
          chance: 0.4
    name_patterns:
      - "Raider Boss"
      - "Raider Veteran #{n}"

  # === GHOULS ===
  Feral Ghoul:
    category: humanoid
    description: "Mindless irradiated humans. Fast and relentless."
    default_agent: npc_hostile
    personality_traits:
