          quantity: "50-150"
      chance:
        - item: "Stimpak"
          quantity: "2-5"
          chance: 0.7
        - item: "Purified Water"
          quantity: "3-6"
          chance: 0.6
    name_patterns:
      - "Merchant #{n}"
      - "Trader #{n}"
