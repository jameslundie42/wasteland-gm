    special:
      base:
        strength: 6
        perception: 7
        endurance: 8
        charisma: 1
        intelligence: 1
        agility: 7
        luck: 3
      variance: 2
    level:
      base: 2
      variance: 3
    skills:
      - Unarmed
    affiliation: Feral
    loot_table:
      guaranteed: []
      chance:
        - item: "Bottle Caps"
          quantity: "1-10"
          chance: 0.3
        - item: "Rad-X"
          chance: 0.1
    name_patterns:
      - "Feral Ghoul #{n}"

  Glowing One:
    category: humanoid
    description: "Highly irradiated ghoul that emits deadly radiation."
    default_agent: npc_hostile
    personality_traits:
      - mindless
      - radioactive aura
      - heals nearby ghouls
    special:
      base:
        strength: 7
        perception: 8
        endurance: 10
        charisma: 1
        intelligence: 2
        agility: 6
        luck: 4
      variance: 1
    level:
      base: 8
      variance: 4
    skills:
      - Unarmed
    affiliation: Feral
    loot_table:
