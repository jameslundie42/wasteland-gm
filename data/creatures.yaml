  # === SUPER MUTANTS ===
  Super Mutant:
    category: humanoid
    description: "FEV-mutated humans. Strong, tough, and aggressive."
    default_agent: npc_hostile
    personality_traits:
      - hates humans
      - simple-minded
      - values strength
    special:
      base:
        strength: 9
        perception: 5
        endurance: 8
        charisma: 2
        intelligence: 3
        agility: 4
        luck: 4
      variance: 2
    level:
      base: 5
      variance: 3
    skills:
      - Melee
      - Guns
    affiliation: Super Mutants
    loot_table:
      guaranteed:
        - item: "Bottle Caps"
          quantity: "20-50"
      chance:
        - item: "Hunting Rifle"
          chance: 0.4
        - item: "Super Sledge"
          chance: 0.3
        - item: "Stimpak"
          quantity: "1-2"
          chance: 0.3
    name_patterns:
      - "Super Mutant #{n}"

  Super Mutant Brute:
    category: humanoid
    description: "Larger, stronger super mutant variant."
    default_agent: npc_hostile
    personality_traits:
      - brutal
      - nearly mindless
      - unstoppable rage
    special:
      base:
        strength: 10
        perception: 4
        endurance: 10
        charisma: 1
        intelligence: 2
        agility: 3
        luck: 3
      variance: 1
    level:
      base: 10
      variance: 3
    skills:
      - Melee
      - Unarmed
    affiliation: Super Mutants
    loot_table:
      guaranteed:
        - item: "Bottle Caps"
          quantity: "40-80"
        - item: "Super Sledge"
          quantity: "1"
      chance:
        - item: "Stimpak"
          quantity: "2-4"
          chance: 0.5
    name_patterns:
      - "Super Mutant Brute #{n}"

  # === CREATURES ===
  Deathclaw:
    category: deathclaw
    description: "Apex predator of the wasteland. Extremely dangerous."
    default_agent: npc_hostile
    personality_traits:
      - territorial
      - apex predator
      - fearless
    special:
      base:
        strength: 10
        perception: 8
        endurance: 10
        charisma: 1
        intelligence: 3
        agility: 9
        luck: 5
      variance: 1
    level:
      base: 15
      variance: 5
    skills:
      - Unarmed
    affiliation: Wildlife
    body_parts:
      head:
        hit_chance_modifier: -25
        damage_multiplier: 2.5
      torso:
        hit_chance_modifier: 0
        damage_multiplier: 1.0
      left arm:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      right arm:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      left leg:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      right leg:
        hit_chance_modifier: -10
        damage_multiplier: 0.75
      tail:
