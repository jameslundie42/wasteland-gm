        endurance: 3
        charisma: 1
        intelligence: 1
        agility: 6
        luck: 3
      variance: 1
    level:
      base: 1
      variance: 1
    skills: []
    affiliation: Wildlife
    body_parts:
      head:
        hit_chance_modifier: -15
        damage_multiplier: 2.0
      thorax:
        hit_chance_modifier: 0
        damage_multiplier: 1.0
      abdomen:
        hit_chance_modifier: 5
        damage_multiplier: 1.5
    loot_table:
      guaranteed: []
      chance:
