  Bloatfly:
    category: insect
    description: "Mutated fly that spits acidic projectiles."
    default_agent: npc_hostile
    personality_traits:
      - aggressive when disturbed
      - territorial
    special:
      base:
        strength: 2
        perception: 6
        endurance: 2
        charisma: 1
        intelligence: 1
        agility: 8
        luck: 3
      variance: 1
    level:
      base: 1
      variance: 2
    skills: []
    affiliation: Wildlife
    body_parts:
      head:
        hit_chance_modifier: -20
