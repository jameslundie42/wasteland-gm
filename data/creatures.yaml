        agility: 2
        luck: 3
      variance: 1
    level:
      base: 3
      variance: 2
    skills:
      - Guns
    affiliation: Robot
    body_parts:
      head:
        hit_chance_modifier: -10
        damage_multiplier: 1.5
      torso:
        hit_chance_modifier: 0
        damage_multiplier: 1.0
      left arm:
        hit_chance_modifier: -5
        damage_multiplier: 0.75
      right arm:
        hit_chance_modifier: -5
        damage_multiplier: 0.75
      left leg:
        hit_chance_modifier: -5
        damage_multiplier: 0.75
      right leg:
