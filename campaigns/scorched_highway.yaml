sessions:
- name: Session 1 - The Broken Bridge
  started: '2026-01-01T12:00:00.000000'
  scenes:
  - name: Dusty Crossroads
    location: Highway 95 Junction
    description: >-
      The old highway splits here - north toward the mountains, east toward
      the coast. A rusted pre-war sign points to "Ridgeview - 12 mi" but
      everyone knows Ridgeview burned years ago. A makeshift camp has grown
      around an old gas station, where travelers trade news and supplies.
    present_characters:
    - Elena Vasquez
    - Tommy Wells
    - Nadia Chen
    - Doc Rivera
    - Jack the Trader
  - name: The Collapsed Overpass
    location: Highway 95 North
    description: >-
      The overpass that once carried traffic over the ravine has partially
      collapsed. Raiders have been spotted using it as a toll station,
      demanding caps or blood from anyone trying to cross. The detour adds
      two days to the journey.
    present_characters:
    - Elena Vasquez
    - Tommy Wells
    - Nadia Chen
    - Doc Rivera
    - Jack the Trader
  current_scene_index: 0
  session_notes: >-
    The party is heading north to deliver medical supplies to a settlement
    called Millbrook. Jack has a contact there who's paying well. Problem is,
    the direct route is blocked by raiders at the collapsed overpass.
  active_characters:
  - Elena Vasquez
  - Tommy Wells
  - Nadia Chen
  - Doc Rivera
  - Jack the Trader
current_session_index: 0

locations:
  Highway 95 Junction:
    description: Major crossroads where the old highways meet
    known_dangers: Occasional raider patrols
  Ridgeview Ruins:
