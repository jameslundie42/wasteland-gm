  Traders Guild:
    disposition: neutral
    notes: Jack's people, good for information and deals

quests:
- name: Medical Run to Millbrook
  status: active
  description: >-
    Deliver a crate of medical supplies to Millbrook settlement.
    Payment: 500 caps on delivery.
  objectives:
  - Get past the raider toll station
  - Reach Millbrook safely
  - Deliver supplies to Elder Morrison

notes: >-
  Example campaign demonstrating the Wasteland GM system.

  Player Characters:
  - Elena (veteran_marcus) - Experienced player, narrative-driven
  - Tommy (newbie_alex) - New player, learning the ropes
  - Nadia (optimizer_sam) - Tactical player, always planning

  Suggested hooks:
  - Pay the raiders' toll (expensive but safe)
  - Fight through the raiders (dangerous but rewarding)
  - Find an alternate route through Ridgeview Ruins (ghouls)
  - Negotiate with the raider boss (Speech check)
