background: >-
  Former NCR Ranger who lost her squad to a Brotherhood ambush ten years ago.
  The scars on her face and hands are a constant reminder of her failure to
  save them. Now she wanders the wastes taking odd jobs, never staying anywhere
  long enough to form attachments. She tells herself it's because she works
  better alone, but the truth is she's terrified of losing anyone else.
personality_traits:
  - Haunted by survivor's guilt
  - Pushes people away before they can get close
  - Cannot abandon someone in danger, even enemies
  - Drinks too much when the nightmares come
