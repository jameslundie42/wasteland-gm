background: >-
  Once a devoted preacher of the Children of the Atom, Miriam's faith shattered
  when she watched her congregation die from radiation poisoning that Atom was
  supposed to protect them from. Now she wanders, searching for something new
  to believe in. She still carries her old robes, unable to throw them away.
  Every person she meets, she studies - looking for proof that humanity is
  worth saving, or evidence that it isn't.
personality_traits:
  - Searching for new meaning after losing faith
  - Genuinely cares about others' wellbeing
  - Asks deep questions at inappropriate times
  - Struggles between cynicism and hope
