background: Galen spent decades as a Brotherhood scribe, more comfortable with a soldering
  iron than a rifle. His T-60 power armor is a testament to his engineering prowess,
  extensively modified and personalized over the years. Now in his twilight years,
  he serves the Brotherhood best as a stationary resource rather than a field operative.
