background: >-
  Nobody knows where Rex came from, including Rex. He woke up three years ago
  in a ditch outside New Vegas with no memory, a head wound, and a Super Sledge
  clutched in his hands. Since then he's been wandering, collecting stories,
  making friends with the strangest people, and somehow surviving situations
  that should have killed him ten times over. He figures if he can't remember
  his past, he might as well make his future interesting.
